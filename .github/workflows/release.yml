name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@">=11.10.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run pack:check
      - run: bun run release:check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: mkdir -p release-artifact && RELEASE_ARTIFACT_DIR=release-artifact bun run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: verified-companion-package
          path: release-artifact/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@">=11.10.0"
      - uses: actions/download-artifact@v4
        with:
          name: verified-companion-package
          path: release-artifact
      - name: Publish verified package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "expected exactly one verified release tarball" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm_tag=beta
          else
            npm_tag=latest
          fi
          npm publish "${tarballs[0]}" --access public --provenance --tag "$npm_tag"
